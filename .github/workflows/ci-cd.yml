name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest --cov=churn_mlops --cov-report=xml --cov-report=term-missing

  train:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      # Fails the whole pipeline (exit 1) if the model misses the quality gate.
      - name: Train model (quality gate)
        run: PYTHONPATH=src python -m churn_mlops.train
      - name: Upload model + MLflow run as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.joblib
            models/metrics.json
            mlruns/
          retention-days: 30

  build-scan-push:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: .
      - name: Set lowercase image name
        run: |
          USER_LC=$(echo "${{ secrets.DOCKERHUB_USERNAME || 'local' }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "IMAGE=${USER_LC}/churn-mlops-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Check Docker Hub secrets are set
        if: github.ref == 'refs/heads/main'
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$U" ] && echo "username: set" || echo "username: MISSING"
          [ -n "$T" ] && echo "token: set" || echo "token: MISSING"
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase image name
        run: |
          USER_LC=$(echo "${{ secrets.DOCKERHUB_USERNAME || 'local' }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "IMAGE=${USER_LC}/churn-mlops-api" >> "$GITHUB_ENV"
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f churn-api || true
            docker run -d --name churn-api --restart unless-stopped -p 80:8000 \
              ${{ env.IMAGE }}:${{ github.sha }}
            # Smoke test: fail the pipeline if the new container is unhealthy.
            for i in $(seq 1 15); do
              curl -fs http://localhost/health && exit 0
              sleep 2
            done
            docker logs churn-api
            exit 1